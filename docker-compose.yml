services:
  # 1. Broker MQTT
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./central/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # 2. Base de datos MariaDB
  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: db
      MYSQL_USER: db
      MYSQL_PASSWORD: db
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

  # 3. Node-RED (Dashboard y monitorización)
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - FLOWS=/data_central/flows.json
    volumes:
      - nodered_data:/data
      - ./central:/data_central
    depends_on:
      - mosquitto
      - mariadb

  # 4. Coordinador Central
  central:
    build: ./central
    container_name: central
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
      mariadb:
        condition: service_healthy
    environment:
      BROKER_HOST: mosquitto
      BROKER_PORT: 1883
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: db
      DB_PASS: db
      DB_NAME: db
      PYTHONUNBUFFERED: 1

  # 5. Flota de Camiones / Tractores
  camiones:
    build: ./camiones
    container_name: camiones
    restart: on-failure
    depends_on:
      central:
        condition: service_started
    environment:
      BROKER_HOST: mosquitto
      BROKER_PORT: 1883
      PYTHONUNBUFFERED: 1

  # 6. Simulador de Cosechadoras
  cosechadoras:
    build: ./cosechadoras
    container_name: cosechadoras
    restart: on-failure
    depends_on:
      camiones:
        condition: service_started
    environment:
      BROKER_HOST: mosquitto
      BROKER_PORT: 1883
      PYTHONUNBUFFERED: 1

volumes:
  nodered_data: